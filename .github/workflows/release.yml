name: Release

# Pushing a tag such as v1.2.3 tests, builds and publishes the archive that
# `vpngo --install-gui` downloads. Running it by hand stops before publishing.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=${GITHUB_REF_NAME#v}; else version="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 tools/build_release.py --version "${{ steps.version.outputs.version }}" --out dist
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "vpngo-gui $VERSION" \
            --notes "Install or upgrade with \`vpngo --install-gui\` (needs vpngo 0.5.0 or newer)." \
            --generate-notes --verify-tag $prerelease
